plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.pocketweb'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.pocketweb"
        minSdk 28
        targetSdk 35
        versionCode 19
        versionName "0.10.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty and release falls back to debug signing.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign release with the debug keystore, matching the minima-core-android node app.
            // IPC is authorized by the MINIMA_ID token, not by signature, so this is sufficient
            // for sideloading. Swap to a dedicated release keystore if uploading to Play.
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Tabbed shell (Browse / Catalog / My Sites / Build / Publish)
    implementation 'androidx.viewpager:viewpager:1.0.0'

    implementation files('libs/minimaapi.aar')

    // SHA3-256: Samsung/Conscrypt does NOT provide "SHA3-256" via MessageDigest on-device
    // (NoSuchAlgorithmException on SM-F966B / API 36), so PocketProtocol.sha3 uses BouncyCastle's
    // SHA3Digest(256) — byte-identical to the core node's impl and available on every device.
    implementation 'org.bouncycastle:bcprov-jdk15on:1.69'

    // Golden-vector acceptance gate runs as a plain JVM unit test (no device needed).
    testImplementation libs.junit
    testImplementation 'org.bouncycastle:bcprov-jdk15on:1.69'
}
